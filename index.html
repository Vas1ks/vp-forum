<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ВП | Выживание с Подписчиками — Форум</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="header">
  <div class="container header-inner">
    <div class="logo">
      <img src="images/logovp.png" alt="Логотип ВП" class="logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/50?text=VP';">
      <div><h1>ВП | Выживание с Подписчиками</h1><p>официальный форум проекта</p></div>
    </div>
    <div class="nav">
      <a onclick="navigateToMain()">Главная</a>
      <a id="createTopicBtn" onclick="showCreateTopicForm()">Создать тему</a>
      <button class="theme-toggle" onclick="toggleTheme()">🌓 Тема</button>
      <div class="profile-search" style="position:relative;">
        <input id="profileSearch" placeholder="Профиль..." autocomplete="off" oninput="showProfileSearchSuggestions()" onfocus="showProfileSearchSuggestions()" onblur="setTimeout(hideProfileSearchSuggestions,200)" onkeydown="if(event.key==='Enter'){const f=document.querySelector('#profileSuggestions .suggestion-item');if(f)f.click();else searchProfile()}">
        <button onclick="searchProfile()">🔍</button>
        <div id="profileSuggestions" class="profile-search-suggestions" style="display:none;"></div>
      </div>
      <div class="auth-wrapper">
        <button class="auth-button" id="authBtn">
          <i class="fas fa-user-circle"></i> 
          <span>Войти</span>
        </button>
        <div class="auth-dropdown" id="authDropdown">
          <a onclick="if(getCurrentUser()) navigateToProfile(getCurrentUser().nick)">Профиль</a>
          <a id="adminPanelBtn" onclick="navigateToAdminPanel()" style="display:none">🧑‍💼 Админ панель</a>
          <a onclick="logout()">Выход</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="main-wrapper">
  <div class="content-box" id="app"></div>
</div>

<footer><div class="footer-inner">© 2026 ВП | Выживание с Подписчиками — Форум проекта</div></footer>

<!-- Модальное окно для авторизации -->
<div id="authModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
  <div style="background:#fff; margin:10% auto; padding:30px; width:380px; border-radius:8px;position:relative;">
    <button onclick="closeAuth()" style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;">×</button>
    <h2 style="margin-bottom:16px;">Вход / Регистрация</h2>
    <input id="authNick" placeholder="Ник" style="width:100%; margin:8px 0; padding:8px;box-sizing:border-box;"><br>
    <input id="authPassword" type="password" placeholder="Пароль" style="width:100%; margin:8px 0; padding:8px;box-sizing:border-box;"><br>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <button onclick="login()" style="flex:1;">Войти</button>
      <button onclick="register()" style="flex:1;">Зарегистрироваться</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
